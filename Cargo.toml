[package]
name = "vaulter"
version = "2.4.0"
edition = "2024"
description = "Patcher, tweaker and mod installer for the Borderlands series"
license = "GPL-3.0-or-later"
repository = "https://github.com/RusticStack/Vaulter"
build = "build.rs"

[[bin]]
name = "Vaulter"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
rust-embed = "8"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
tar = "0.4"
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3"] }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"
resvg = { version = "0.45", default-features = false }

# Our fork of gpui (backdrop blur for Fluent acrylic, and more) and of
# gpui-component (acrylic flyouts). See vendor/README.md.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
gpui-component = { path = "vendor/gpui-component" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
# Smaller, faster binary. Unwinding stays on: capture and install guards
# restore the user's files while a panic unwinds.
lto = "fat"
codegen-units = 1
strip = true

# Release-speed builds for testing (`cargo build --profile quick`): thin LTO
# and parallel codegen use every core. Published builds use `release`.
[profile.quick]
inherits = "release"
lto = "thin"
codegen-units = 16
